# Adaptive Sampling Pipeline for CartPole PyBullet
# =====================================================================
# Uses pre-collected trajectory data with conformal prediction
# to efficiently build training datasets
# =====================================================================

defaults:
  - system: cartpole
  - _self_

name: adaptive_cartpole_pybullet
seed: 42

# Output directory
output_dir: /common/users/dm1487/tripods/adaptive/outputs/adaptive_cartpole_pybullet/${now:%Y-%m-%d_%H-%M-%S}

# Device
device: cuda:0

# =====================================================================
# Data Source Configuration
# =====================================================================
data_source:
  trajectories_dir: /common/users/shared/pracsys/genMoPlan/data_trajectories/cartpole_pybullet/trajectories
  shuffled_indices_file: /common/users/shared/pracsys/genMoPlan/data_trajectories/cartpole_pybullet/shuffled_indices.txt
  roa_labels_file: /common/users/shared/pracsys/genMoPlan/data_trajectories/cartpole_pybullet/roa_labels.txt

# Dataset splits (val/test are subsets of training with overlap)
val_ratio: 0.1      # 10% of training for validation
test_ratio: 0.1     # 10% of training for testing

# =====================================================================
# Adaptive Sampling Configuration
# =====================================================================
initial_train_size: 500    # Initial training trajectories
n_epochs: 20               # Number of adaptive sampling epochs
samples_per_epoch: 50      # New candidates per epoch
d1_ratio: 0.5              # Fraction always added (calibration)
warm_start: false          # If true, continue training from previous epoch's checkpoint

# =====================================================================
# Conformal Prediction Configuration
# =====================================================================
conformal:
  delta: 0.05              # Unknown region half-width
  w: 0.9                   # Misclassification weight
  alpha: 0.1               # 90% coverage guarantee
  num_mc_samples: 10      # MC samples for probability estimation (fitting)
  num_mc_samples_eval: 10  # MC samples for full ROA evaluation (faster)
  attractor_radius: 0.1    # For classify_attractor()
  calibration_ratio: 0.3   # Fraction of training labels for calibration (rest for λ optimization)

# =====================================================================
# Flow Matcher Training Configuration
# =====================================================================
batch_size: 64
val_batch_size: 2048
num_workers: 4
latent_dim: 2

# Trainer: PyTorch Lightning
trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_model_summary: true
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      # dirpath: set dynamically per epoch in training script
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      filename: "best-{epoch:02d}-{val_loss:.4f}"
      auto_insert_metric_name: false
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val_loss
      mode: min
      patience: 500
      verbose: true

# Flow matching specific settings
flow_matching:
  latent_dim: ${latent_dim}
  num_integration_steps: 100       # ODE solver steps for inference
  mae_val_frequency: 10            # Compute MAE validation every N epochs

# Flow Matcher
flow_matcher:
  _target_: src.flow_matching.cartpole.latent_conditional.flow_matcher.CartPoleLatentConditionalFlowMatcher

# Model: CartPole UNet
model:
  _target_: src.model.cartpole_unet.CartPoleUNet
  embedded_dim: 5              # (x_norm, sin θ, cos θ, ẋ_norm, θ̇_norm)
  latent_dim: ${latent_dim}
  condition_dim: 5             # Embedded start state
  time_emb_dim: 64
  hidden_dims: [256, 512, 1024, 512, 256]
  output_dim: 4                # Velocity in tangent space
  use_input_embeddings: false
  input_emb_dim: 64

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 1e-5
  betas: [0.9, 0.999]

# Scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 10
  min_lr: 1e-6

# System (CartPole)
system:
  _target_: src.systems.cartpole.CartPoleSystem
  bounds_file: /common/users/dm1487/arcmg_datasets/cartpole/new_cartpole_data_bounds.pkl

# Hydra
hydra:
  run:
    dir: ${output_dir}
