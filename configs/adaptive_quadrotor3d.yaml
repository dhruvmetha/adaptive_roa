# Adaptive Sampling Pipeline for Quadrotor 3D
# =====================================================================
# Uses pre-collected trajectory data with conformal prediction
# to efficiently build training datasets for Quadrotor 3D (R^3 x SO(3) x R^6 manifold)
# =====================================================================

defaults:
  - system: quadrotor3d
  - conformal: default
  - adaptive: default
  - _self_

name: adaptive_quadrotor3d
seed: 42

# User-specific paths (loaded from .env file via resolvers)
# To customize: edit .env file with EXP_DIR and DATA_DIR
exp_dir: ${exp_dir:}
data_dir: ${data_dir:}

use_loss_weights: false          # If true, weight loss by state limits (proportional)
use_log_loss_weights: true
quat_loss_weight: 1.0            # Scalar weight for quaternion loss dims (when use_loss_weights=true)

noise_scale: 1.0                 # Scale factor for initial noise (0-1), reduces variance when < 1

threshold_mode: dynamic # dynamic or fixed

use_manifold: false               # If true, use SO(3) manifold; if false, use Euclidean R^13

# Output directory
training_index: 0
output_dir: ${exp_dir}/${name}/outputs/training_index_${training_index}_d2_ratio_${d2_ratio}_warm_start_${warm_start}_manifold_${use_manifold}_threshold_mode_${threshold_mode}_adapt_iter_${n_epochs}/${now:%Y-%m-%d_%H-%M-%S}

# Device
device: cuda:0

# =====================================================================
# Data Source Configuration
# =====================================================================
data_source:
  base_dir: ${data_dir}/quadrotor3D_lqr
  trajectories_dir: ${data_source.base_dir}/trajectories
  train_test_splits_dir: ${data_source.base_dir}/train_test_splits
  # Shuffled indices and labels (aligned, for training)
  shuffled_indices_file: ${data_source.train_test_splits_dir}/shuffled_indices_${training_index}.txt
  shuffled_labels_file: ${data_source.train_test_splits_dir}/shuffled_labels_${training_index}.txt
  # Eval states (full dataset with start, end, labels - for evaluation only)
  eval_states_file: ${data_source.base_dir}/eval_states.txt
  # Held-out calibration set (20% of eval_states, for final q_hat calibration)
  cal_set_file: ${data_source.base_dir}/cal_set.txt
  # Held-out test set (80% of eval_states, for final evaluation)
  test_set_file: ${data_source.base_dir}/test_set.txt

# Dataset splits (val/test are subsets of training with overlap)
val_ratio: 0.1      # 10% of training for validation
test_ratio: 0.1     # 10% of training for testing

# =====================================================================
# Adaptive Sampling Configuration
# =====================================================================
initial_train_size: 300    # Initial training trajectories
n_epochs: 20              # Number of adaptive sampling epochs
samples_per_epoch: 100      # New candidates per epoch (for fixed strategy only)
warm_start: false           # If true, continue training from previous epoch's checkpoint

# Sampling mode: "conformal", "direct", or "ranked"
# - "conformal": D1/D2 split with q_hat calibration (default)
# - "direct": D1/D2 split with λ*/δ* thresholds directly (no q_hat)
# - "ranked": No D1/D2 split; rank n_ranked_candidates by NC score (y=UNKNOWN),
#             select lowest samples_per_epoch
sampling_mode: conformal

# Ranked sampling config (only used when sampling_mode="ranked")
n_ranked_candidates: 1000   # Number of candidates to evaluate for ranking

# D1/D2 Split for Adaptive Sampling
# D1 = calibration set (random), used to calibrate q_hat
# D2 = uncertain set, sampled using q_hat-based prediction sets
d2_ratio: 0.5              # Fraction for D2 (uncertainty-filtered using q_hat).
                          #   (1 - d2_ratio) = fraction for D1 (calibration, random)
                          #   d2_ratio = fraction for D2 (uncertain sampling with q_hat)
                          # Example: d2_ratio=0.75 → D1=25%, D2=75%
batch_size_sampling: 50    # Size of batches when searching for uncertain points in D2
max_samples_per_epoch: 50000 # Safety cap on total candidates evaluated per epoch

# =====================================================================
# Conformal Prediction Configuration
# =====================================================================
conformal:
  # Toggle conformal prediction on/off
  # - true: Calibrate q_hat on D1, use prediction sets for uncertainty
  # - false: Skip q_hat calibration, use λ*/δ* thresholds directly for uncertainty
  use_conformal: true

  verbose: false           # Print detailed debug info (q_hat calibration, scores, etc.)
  delta: 0.05              # Unknown region half-width (used when optimize_mode="lambda")
  w: 1.0                   # Misclassification weight (1.0 = only minimize errors, ignore unknown rate)
  alpha_sampling: 0.1      # Alpha for sampling conformal prediction
  alpha_eval: 0.1          # Alpha for evaluation conformal prediction
  num_mc_samples: 10       # MC samples for probability estimation (fitting)
  num_mc_samples_eval: 10  # MC samples for full ROA evaluation (faster)
  attractor_radius: 0.2   # For classify_attractor() - matches dataset success threshold
  # NOTE: calibration_ratio removed - q_hat is now calibrated on D1 samples (not training split)

  # Optimization mode: "lambda" or "delta"
  # - "lambda": Optimize λ* with fixed δ (find best decision boundary)
  # - "delta": Optimize δ* with fixed λ=0.5 (find best uncertainty width)
  optimize_mode: delta

  # Decision rule: "one_sided" or "two_sided"
  # - "one_sided": Uses only p_success (for pendulum, mountain car)
  # - "two_sided": Uses both p_success and p_failure (for 3-way classification)
  decision_rule: two_sided

  # Threshold mode: "dynamic" or "fixed"
  # - "dynamic": Run optimization to find λ*/δ*, then calibrate q_hat
  # - "fixed": Skip optimization, use fixed thresholds for q_hat calibration and sampling
  threshold_mode: ${threshold_mode}

  # Fixed thresholds (only used when threshold_mode="fixed")
  fixed_lambda_star: 0.5   # Fixed decision boundary
  fixed_delta_star: 0.1    # Fixed uncertainty half-width

  # Lambda optimization (when optimize_mode="lambda")
  lambda_grid_size: 100    # Number of grid points for λ search

  # Delta optimization (when optimize_mode="delta")
  delta_grid_size: 100     # Number of grid points for δ search
  delta_min: 0.05          # Minimum δ value
  delta_max: 0.45          # Maximum δ value

  # Max samples from endpoint dataset for λ*/δ* optimization
  # Uses min(10% of dataset, max_opt_samples). If dataset <= max_opt_samples, uses all.
  max_opt_samples: 5000

# =====================================================================
# Flow Matcher Training Configuration
# =====================================================================
batch_size: 1024
val_batch_size: 2048
num_workers: 4
latent_dim: 0  # Larger latent dim for 13D state

# Trainer: PyTorch Lightning
trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_model_summary: true
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      # dirpath: set dynamically per epoch in training script
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
      filename: "best-{epoch:02d}-{val_loss:.4f}"
      auto_insert_metric_name: false
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val_loss
      mode: min
      patience: 2000
      verbose: true

# Flow matching specific settings
flow_matching:
  latent_dim: ${latent_dim}
  num_integration_steps: 100       # ODE solver steps for inference
  mae_val_frequency: 10            # Compute MAE validation every N epochs
  use_loss_weights: ${use_loss_weights}          # If true, weight loss by state limits (proportional)
  use_log_loss_weights: ${use_log_loss_weights}      # If true (with use_loss_weights=true), use 1+log(limit) for more balanced weights
  quat_loss_weight: ${quat_loss_weight}              # Scalar weight for quaternion loss dimensions
  use_manifold: ${use_manifold}               # If true, use SO(3) manifold; if false, use Euclidean R^13
  clamp_noise: false                # Clamp noise to [-1, 1] to prevent ODE divergence during validation MAE
  zero_latent: true                # Use zero latent vectors instead of random sampling
  noise_scale: ${noise_scale}                # Scale factor for initial noise (0-1), reduces variance when < 1
  # NOTE: model.output_dim is auto-adjusted based on use_manifold (12 for SO3, 13 for Euclidean)

# Flow Matcher
flow_matcher:
  _target_: adaptive_roa.flow_matching.quadrotor_3d.latent_conditional.flow_matcher.Quadrotor3DLatentConditionalFlowMatcher

# Model: Quadrotor 3D UNet
model:
  _target_: adaptive_roa.model.quadrotor3d_unet.Quadrotor3DUNet
  embedded_dim: 13               # (x, y, z, qw, qx, qy, qz, ẋ, ẏ, ż, p, q, r)
  latent_dim: ${latent_dim}
  condition_dim: 13              # Embedded start state
  time_emb_dim: 64
  hidden_dims: [512, 1024, 1024, 512]  # Larger network for 13D state
  output_dim: 12                 # Velocity in tangent space (3 pos + 3 rot + 6 vel)
  use_input_embeddings: false
  input_emb_dim: 128

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  weight_decay: 1e-5
  betas: [0.9, 0.999]

# Scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 10
  min_lr: 1e-6

# System (Quadrotor 3D)
system:
  _target_: adaptive_roa.systems.quadrotor3d.Quadrotor3DSystem
  dataset_dir: ${data_dir}/quadrotor3D_lqr

# Hydra
hydra:
  run:
    dir: ${output_dir}
