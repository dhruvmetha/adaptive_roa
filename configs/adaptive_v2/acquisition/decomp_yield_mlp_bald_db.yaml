# @package _global_
# decomp_yield_mlp_bald with the K-sample MC bias removed from the BALD score.
#
# Why this arm exists. At full depth on all four cprl levels the BALD swap made
# the CLASSIFIER better than its variance twin and the FM WORSE, 4-0 and 0-4.
# The obvious suspect is the bias this removes: plug-in BALD is inflated by
# ~(1/2K)(1 - 1/M), about 0.021 nats at K=20/M=5. Under a plain top-N rule a
# constant offset is harmless. Under the yield rule the ranking key is
#   (score + bias) * L_hat
# so the bias is MULTIPLIED by the length weight and preferentially promotes
# long-rollout candidates. The FM ensembles estimate p_m by Monte Carlo and so
# carry the bias; the classifier does a single forward pass, k=None, and carries
# none. That asymmetry lines up exactly with the 4-0 / 0-4 split, which is what
# this arm tests.
#
# If the bias is the cause, yield_mlp_bald_db should recover the FM ground lost
# to yield_mlp, and the classifier arm should be unchanged (k=None makes the
# correction a no-op, so clf_yield_bald_db is a NULL CONTROL and any movement
# there is seed noise, not signal).
#
# Measured on 40k synthetic states, K=20 M=5: raw bias +0.02193 vs predicted
# 0.02000, debiased +0.00253, an 8.7x reduction. Decided states stay at exactly
# 0 because the correction is gated per member on 0 < p_hat < 1.
sampling_mode: decomp_yield_mlp_bald_db
acquisition:
  _target_: adaptive_roa.adaptive_v2.strategy.yield_mlp.YieldMLPAcquisitionStrategy
  score: epistemic_bald_debiased
  d2_ratio: 1.0
  n_candidates: 50000
  alpha: 1.0
  hidden: [64, 64]
  knn_k: 15
  min_labeled: 20
  mlp_seed: 0
  prior_len_success: 150.0
  prior_len_failure: 1000.0
  min_per_class: 5
  verbose: true
