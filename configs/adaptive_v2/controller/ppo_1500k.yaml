# @package _global_
# Same PPO policy and success criterion as `ppo`; the only difference is the
# trainable pool, 1,500,000 flights against 100,000 (shuffled_indices_0.txt).
# The controller VALUE must be exactly `ppo_1500K` (capital K) to match the dataset
# directory at stochastic/quadrotor3D/.../ppo_1500K/....
# Exists as a group member because `controller` collides with this config group,
# so `controller=ppo_1500k` and `++controller=ppo_1500k` are both rejected by Hydra
# -- a plain value override is impossible and `+controller=ppo_1500k` needs a file.
# Carries no system semantics: attractor_radius, goal and the termination box all
# stay with quadrotor3d_ppo_stoch.yaml.
controller: ppo_1500K
