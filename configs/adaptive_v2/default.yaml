defaults:
  - system: pendulum
  # threshold/calibration must precede predictor so a predictor group (e.g.
  # classifier) can override their decision_rule; a later group wins.
  - threshold: conformal_threshold
  - calibration: conformal_calibration
  - predictor: generative
  - acquisition: direct
  - eval: full_roa
  - _self_

adaptive_v2:
  artifact_schema_version: 2
  save_legacy_results_json: true
  save_v2_artifacts: true

hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false
