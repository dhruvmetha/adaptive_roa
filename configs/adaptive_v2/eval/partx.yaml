# @package _global_
eval:
  _target_: adaptive_roa.partx.eval.PartXEvaluator
  base:
    _target_: adaptive_roa.adaptive_v2.eval.full_roa.FullROAEvaluator
    predictor_type: ${predictor.type}
    alpha_eval: 0.1
    attractor_radius: ${attractor_radius}
    num_mc_samples_eval: 100
    decision_rule: ${decision_rule}
    # max_eval_rows default lives in system/_base.yaml (eval.max_eval_rows); mirror
    # it here because PartXEvaluator wraps FullROAEvaluator under eval.base, so the
    # base evaluator reads cfg.base.max_eval_rows, not cfg.max_eval_rows directly.
    max_eval_rows: ${eval.max_eval_rows}
    refine_invalids: false
    refine_t_min: 0.7
    refine_t_max: 0.9
    refine_num_steps: 100
    refine_max_attempts: 5
    verbose: true
