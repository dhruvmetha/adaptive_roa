# @package _global_
# Deterministic-paper rerun protocol. Rulings live in
# papers/det_paper/EXPERIMENT_TRACKER.md; IDs below refer to it.
#
# Usage: scripts/run_adaptive.py system=<det system> acquisition=<direct|ranked|entropy> \
#            +experiment=det_rerun [acquisition.d2_ratio=0 for uniform arms]
#
# +experiment is composed last, so these values win over the predictor and
# acquisition groups; CLI overrides still win over this file.

# Every knob a cell varies is in the path, so two cells can never share a dir.
output_dir: ${exp_dir}/det_rerun/${name}/${predictor.name}/${sampling_mode}_d2_${acquisition.d2_ratio}_K_${acquisition_mc_samples}_w_${threshold.w}_sched_${initial_train_size}-${samples_per_epoch}x${n_epochs}_seed_${seed}/${now:%Y-%m-%d_%H-%M-%S}_exp_${exp_id}

# D06: one acquisition K for every signal. direct and ranked draw through the
# probability backend's estimator; entropy draws its own samples. Ablation A-K1
# moves this to 50 and 100.
acquisition_mc_samples: 20

probability:
  num_mc_samples: ${acquisition_mc_samples}

acquisition:
  num_mc_samples: ${acquisition_mc_samples}
  d2_ratio: 0.5            # D05; ablation A-D2 covers 0.75 and 1.0
  # D25 (ruled 2026-10-30): a round that direct leaves short is topped up with
  # uniform starts, logged as "uniform_fill" (pick log, or the round's diagnostics
  # in start mode) and n_d2_fill in the epoch results. A variation of the direct
  # rule; reported as "direct with uniform top-up".
  fill_shortfall: true

eval:
  num_mc_samples_eval: 100

# Eval-time q_hat is calibrated on the cal set by the calibration backend. Its
# scores must come from the same K as the test-set scores they are compared
# with; the default (10 against 100) breaks that.
calibration:
  num_mc_samples: ${eval.num_mc_samples_eval}

adaptive_v2:
  filter_confident_pairs: false   # D16: same training data for every head

# D26 (ruled 2026-10-30, replacing D22): acquisition candidates are trajectory
# starts only; the uniform share takes the next starts in pool order. The suffix
# pool (candidate_mode=suffix) is ablation A-P. test_ratio 0: test states come
# from the disjoint test file (D15).
candidate_mode: start
test_ratio: 0

data_source:
  timeout_intermediates: drop     # C15: a timeout contributes only (x_0, x_T)
  horizon_steps: ${horizon_steps}

# Prediction store (tracker section 9): val/cal outcome counts and the
# threshold-fit probabilities every epoch; all K endpoints on test (a fixed
# seed-0 subsample of at most endpoint_test_rows), val and cal at the reporting
# epochs. Reporting epochs are initial, middle, final; override per schedule
# (quad3d 60k: [0, 6, 10]; the shared 110k uniform run adds the epochs that
# land on 20k, 30k and 40k, D24).
prediction_store:
  enabled: true
  endpoint_epochs: [0, 5, 10]
  endpoint_test_rows: 100000
