# @package _global_
# Det rerun with FPR-capped thresholds (Idea 6): det_rerun.yaml plus threshold=fpr_cap
# for the per-epoch fit, acquisition and the in-run evaluation.
#
# Usage: scripts/run_adaptive.py system=<det system> predictor=<arm> acquisition=<direct|ranked> \
#            +experiment=det_rerun_fprcap
#
# Only direct and ranked read thresholds; entropy and uniform arms have nothing to
# change here. A launcher that passes output_dir itself must name the rule and
# alpha_s in it, as this file's path does, so a new arm can never share a
# directory with an existing one.
defaults:
  - det_rerun
  - override /threshold: fpr_cap
  - _self_

# The loop's one cap, for the per-epoch fit, acquisition and the in-run evaluation:
# 1% (user, 2026-11-02). Fit at the first 20 of the 100 val draws (fpr_cap.yaml's
# fit_mc_samples, the acquisition K), 0.5% leaves the quad3D final-state arms with
# no success label. The post-hoc scorer still reports 0.25%, 0.5% and 1%.
threshold:
  alpha_s: 0.01

acquisition:
  rule: tau

output_dir: ${exp_dir}/det_rerun/${name}/${predictor.name}/${sampling_mode}_rule_${acquisition.rule}_alpha_s_${threshold.alpha_s}_d2_${acquisition.d2_ratio}_K_${acquisition_mc_samples}_sched_${initial_train_size}-${samples_per_epoch}x${n_epochs}_seed_${seed}/${now:%Y-%m-%d_%H-%M-%S}_exp_${exp_id}
