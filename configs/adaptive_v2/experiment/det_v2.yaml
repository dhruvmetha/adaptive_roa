# @package _global_
# det_v2 protocol (Claude Docs "Deterministic method draft", Tracker tab: Protocol).
# Composed by every run config under det_v2/runs/; a run config's own values win.
#
# K = 100 for acquisition, threshold opt and evaluation (val, cal, test).
#
# Keys marked "speedup" are the bias-free speedups of the 2026-11-06 review, on from
# epoch 0 of every run: each is bit-identical or an unbiased re-draw (see
# tests/adaptive_v2/test_det_v2_speedups.py). The run configs add
# predictor.flow_matching.mae_val_frequency (FM) and
# predictor.final_state.reuse_body_features (final-state models).
acquisition_mc_samples: 100

probability:
  num_mc_samples: ${acquisition_mc_samples}

acquisition:
  num_mc_samples: ${acquisition_mc_samples}

threshold:
  num_mc_samples: ${acquisition_mc_samples}

eval:
  num_mc_samples_eval: 100
  # Three outcomes always (success, failure, invalid); see det_rerun.yaml for why null
  # would fold invalid into failure on the stochastic tree's zero-noise datasets.
  binary_outcomes: false
  plot_epochs: [0, 5, 10]           # speedup: scatter/heatmap plots at the reporting epochs only

calibration:
  num_mc_samples: ${eval.num_mc_samples_eval}

adaptive_v2:
  filter_confident_pairs: false
  endpoint_error: false             # speedup: training-set endpoint error, read only by legacy scripts

predictor:
  batched_indexing: true            # speedup: one index op per batch, same RandomSampler
  lightning_trainer:
    enable_progress_bar: false      # speedup: no per-step .item() sync, no ~300 MB of log

# Candidates are trajectory starts only; test states come from the disjoint test file.
candidate_mode: start
test_ratio: 0

# p-hat on D_acq (predictions_thrfit), D_val, D_cal and D_test every epoch; all
# endpoints at the reporting epochs.
prediction_store:
  enabled: true
  endpoint_epochs: [0, 5, 10]
  endpoint_test_rows: 100000
  reuse_cal_for_qhat: true          # speedup: predict D_cal once; q_hat_eval from the stored counts

seed: 99512
n_epochs: 11
