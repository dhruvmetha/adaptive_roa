# @package _global_
# partX on cartpole_pybullet, matching the FM (generative) adaptive experiments.
# Training/validation amounts are inherited from the system config
# (configs/adaptive_v2/system/cartpole_pybullet.yaml, samples_per_epoch from
# system/_base.yaml) — the FM systems' schedule: initial_train_size=300,
# samples_per_epoch=100, n_epochs=15.
#
# Usage:
#   python scripts/run_adaptive.py +experiment=partx_cartpole

defaults:
  - override /system: cartpole_pybullet
  - override /predictor: gp
  - override /acquisition: partx
  - override /eval: partx
