# @package _global_
# partX on cartpole_pybullet. Total training-pool size grows 300 -> 1000 in
# steps of 50 over 15 adaptive epochs (init=300, +50/epoch): totals 300,350,...,1000.
# Fully adaptive (d2_ratio=1.0); conformal coverage only at eval time (cal_set).
#
# Usage:
#   python scripts/run_adaptive.py +experiment=partx_cartpole

defaults:
  - override /system: cartpole_pybullet
  - override /predictor: gp
  - override /acquisition: partx
  - override /eval: partx

initial_train_size: 300
samples_per_epoch: 50
n_epochs: 15
