# @package _global_
# partX on pendulum. Total training-pool size grows 50 -> 500 in steps of 50
# over 10 adaptive epochs (init=50, +50/epoch): totals 50,100,...,500.
# Fully adaptive (d2_ratio=1.0); conformal coverage only at eval time (cal_set).
#
# Usage:
#   python scripts/run_adaptive.py +experiment=partx_pendulum

defaults:
  - override /system: pendulum
  - override /predictor: gp
  - override /acquisition: partx
  - override /eval: partx

initial_train_size: 50
samples_per_epoch: 50
n_epochs: 10
