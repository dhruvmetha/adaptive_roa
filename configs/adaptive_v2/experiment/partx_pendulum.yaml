# @package _global_
# partX on pendulum, matching the FM (generative) adaptive experiments.
# Training/validation amounts are inherited from the system config
# (configs/adaptive_v2/system/pendulum.yaml) — the single source of truth the
# FM systems use: initial_train_size=100, samples_per_epoch=100, n_epochs=19.
#
# Usage:
#   python scripts/run_adaptive.py +experiment=partx_pendulum

defaults:
  - override /system: pendulum
  - override /predictor: gp
  - override /acquisition: partx
  - override /eval: partx
