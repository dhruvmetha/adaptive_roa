# @package _global_
# partX on pendulum, using the same training/validation schedule as the
# real adaptive classification experiments (scripts/overnight_classifier_4systems.sh):
# initial_train_size=50, samples_per_epoch=50, n_epochs=10 (grows 50 -> 500).
#
# Usage:
#   python scripts/run_adaptive.py +experiment=partx_pendulum

defaults:
  - override /system: pendulum
  - override /predictor: gp
  - override /acquisition: partx
  - override /eval: partx

initial_train_size: 50
samples_per_epoch: 50
n_epochs: 10
