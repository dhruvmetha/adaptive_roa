# @package _global_
# Local prediction mode: trajectory-level flow matching via local dynamics
# Generates full trajectory [B, T, D], extracts final timestep as endpoint
#
# Usage:
#   system=pendulum prediction_mode=local
#   system=cartpole_pybullet prediction_mode=local
#   system=quadrotor2d prediction_mode=local
#   system=quadrotor3d prediction_mode=local
prediction_mode: local

# No latent z for local mode — noise trajectory provides stochasticity
latent_dim: 0

# Override flow_matcher target from system config's local target
flow_matcher:
  _target_: ${flow_matcher_local._target_}

# Trajectory Transformer model — dims from system's model_dims
model:
  _target_: adaptive_roa.model.temporal_transformer.TemporalTransformer
  sequence_length: ${flow_matching.sequence_length}
  input_dim: ${model_dims.embedded_dim}
  output_dim: ${model_dims.output_dim}
  latent_dim: ${latent_dim}
  condition_dim: ${model_dims.condition_dim}
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  feedforward_dim: 1024
  dropout: 0.1

flow_matching:
  sequence_length: 32
  history_length: 1

# Enable per-timestep trajectory checking for MC evaluation
# When true: classify trajectory at every timestep (first success/failure wins)
# When false: check endpoint only (same as global mode)
conformal:
  trajectory_checking: true
