# @package _global_
# bnn_ensemble_reg wired for BALD acquisition. See bnn_mfvi_reg_bald.yaml for
# why `name` stays the base arm's and why hidden_dims goes per-system.
#
# ONE ESTIMATOR ASYMMETRY, stated so it is not invisible in results. On the
# acquisition path this arm ENUMERATES its M members exactly, because
# PosteriorEndpointMCProbabilityBackend reaches the posterior directly and
# forward_all_members is available there. Evaluation still goes through
# FinalStateModelHandle, whose one-fresh-draw-per-call contract makes the
# marginal a K-draws-WITH-REPLACEMENT mixture (final_state_handle.py:57-74).
# So acquisition and eval use slightly different estimators on this arm alone.
# The alternative was leaving a known systematic bias in the acquisition signal,
# which is worse: at M=5, K=10 the member-weight SD is 0.126 against an exact
# 0.200.
defaults:
  - /probability: posterior_endpoint_mc
predictor:
  type: generative          # family tag: endpoint data, endpoint-MC backend, fast eval branch
  name: bnn_ensemble_reg    # arm name: keys the export registry
  trainer_target: adaptive_roa.adaptive_v2.trainers.final_state_trainer.FinalStateTrainer
  batch_size: 1024
  val_batch_size: 2048
  final_state:
    posterior: ensemble
    hidden_dims: ${model_dims.mlp_hidden_dims}
    lr: 1.0e-3
    weight_decay: 1.0e-5
    max_epochs: 200
    patience: 20
    # NOT CONSUMED by this arm. The ensemble branch builds `deterministic`
    # members and does not forward prior_sigma (bayesian_mlp.py:80-88), so each
    # member's only regularization is the weight_decay above.
    prior_sigma: 1.0
    # M members. FinalStateTrainer raises unless probability.num_mc_samples >=
    # 2*M and warns below 20*M, because the HANDLE's marginal samples members
    # with replacement. That guard still applies to eval; see the header note
    # for why acquisition is not affected.
    n_members: 5
    beta_nll: 0.5           # Seitzer et al. 2022; 0.0 is plain Gaussian NLL
  lightning_trainer:
    gradient_clip_val: 1.0
    log_every_n_steps: 10
