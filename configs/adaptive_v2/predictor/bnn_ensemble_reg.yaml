# @package _global_
defaults:
  - /probability: endpoint_mc
predictor:
  type: generative          # family tag: endpoint data, endpoint-MC backend, fast eval branch
  name: bnn_ensemble_reg    # arm name: keys the export registry
  trainer_target: adaptive_roa.adaptive_v2.trainers.final_state_trainer.FinalStateTrainer
  batch_size: 1024
  val_batch_size: 2048
  final_state:
    posterior: ensemble
    hidden_dims: [256, 512, 256]
    lr: 1.0e-3
    weight_decay: 1.0e-5
    max_epochs: 200
    patience: 20
    # NOT CONSUMED by this arm. The ensemble branch builds `deterministic`
    # members and does not forward prior_sigma (bayesian_mlp.py:80-88), so each
    # member's only regularization is the weight_decay above. See mlp_det.yaml
    # for why the four arms' priors are not, and cannot cheaply be made,
    # identical.
    prior_sigma: 1.0
    # M members. The marginal over members is SAMPLED WITH REPLACEMENT here,
    # unlike the outcome-family ensemble which enumerates all M exactly
    # (posteriors.py:166-179); the final-state handle's one-fresh-draw-per-call
    # contract leaves no point at which enumeration is possible. At this M and
    # the endpoint_mc default K=10 the member weights carry SD 0.126 against an
    # exact 0.200. The trainer warns below 20*M. Treat this arm's marginal as
    # noisier than its outcome-family counterpart at equal M.
    n_members: 5
    beta_nll: 0.5           # Seitzer et al. 2022; 0.0 is plain Gaussian NLL
  lightning_trainer:
    gradient_clip_val: 1.0
    log_every_n_steps: 10
