# @package _global_
defaults:
  - /probability: classifier_prob
threshold:
  decision_rule: one_sided
calibration:
  decision_rule: one_sided
predictor:
  type: classifier          # family tag: drives dataset kind and eval branch
  name: bnn_laplace         # arm name: keys the export registry
  trainer_target: adaptive_roa.adaptive_v2.trainers.bayesian_mlp_trainer.BayesianMLPTrainer
  batch_size: 1024
  val_batch_size: 2048
  bnn:
    posterior: laplace
    hidden_dims: [256, 512, 256]
    lr: 1.0e-3
    weight_decay: 1.0e-5
    max_epochs: 200
    patience: 20            # on val_nll, NOT the ELBO: the KL term is data-independent
                            # and shrinks monotonically, so ELBO-monitored early stopping
                            # never fires and the "best" checkpoint is always the last epoch.
    prior_sigma: 1.0        # isotropic Gaussian prior, identical across arms
    n_marginal_samples: 64
  lightning_trainer:
    gradient_clip_val: 1.0
    log_every_n_steps: 10
