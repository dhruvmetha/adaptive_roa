# @package _global_
defaults:
  - /probability: endpoint_mc
predictor:
  type: generative          # family tag: endpoint data, endpoint-MC backend, fast eval branch
  name: bnn_laplace_reg     # arm name: keys the export registry
  trainer_target: adaptive_roa.adaptive_v2.trainers.final_state_trainer.FinalStateTrainer
  batch_size: 1024
  val_batch_size: 2048
  final_state:
    posterior: laplace
    hidden_dims: [256, 512, 256]
    lr: 1.0e-3
    weight_decay: 1.0e-5
    max_epochs: 200
    patience: 20
    # Isotropic N(0, 1) prior over the LAST LAYER only, as the GGN's
    # prior_precision = 1/prior_sigma^2 (bayesian_mlp.py:90-98); the body is
    # trained as a plain MAP fit under weight_decay. NOT identical to the other
    # arms: mfvi applies the same prior to every layer, and mlp_det /
    # bnn_ensemble_reg do not consume prior_sigma at all. See mlp_det.yaml.
    prior_sigma: 1.0
    beta_nll: 0.5           # Seitzer et al. 2022; 0.0 is plain Gaussian NLL
  lightning_trainer:
    gradient_clip_val: 1.0
    log_every_n_steps: 10
