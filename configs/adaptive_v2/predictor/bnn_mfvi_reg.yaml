# @package _global_
defaults:
  - /probability: endpoint_mc
predictor:
  type: generative          # family tag: endpoint data, endpoint-MC backend, fast eval branch
  name: bnn_mfvi_reg        # arm name: keys the export registry
  trainer_target: adaptive_roa.adaptive_v2.trainers.final_state_trainer.FinalStateTrainer
  batch_size: 1024
  val_batch_size: 2048
  final_state:
    posterior: mfvi
    hidden_dims: [256, 512, 256]
    lr: 1.0e-3
    weight_decay: 1.0e-5
    max_epochs: 200
    patience: 20
    # Isotropic N(0, 1) prior over EVERY layer's weights, via the VILinear KL
    # term (bayesian_mlp.py:66-71). NOT identical to the other arms: laplace
    # applies the same prior to the last layer only, and mlp_det /
    # bnn_ensemble_reg do not consume prior_sigma at all. See mlp_det.yaml.
    prior_sigma: 1.0
    kl_weight: 1.0          # beta = 1: untempered. Any other value is a TEMPERED result.
    beta_nll: 0.5           # Seitzer et al. 2022; 0.0 is plain Gaussian NLL
  lightning_trainer:
    gradient_clip_val: 1.0
    log_every_n_steps: 10
