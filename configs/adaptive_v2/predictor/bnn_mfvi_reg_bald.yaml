# @package _global_
# bnn_mfvi_reg wired for BALD acquisition.
#
# The PREDICTOR is unchanged from bnn_mfvi_reg, which is why `name` stays
# `bnn_mfvi_reg`: that field keys the export registry
# (probabilistic_classifier/registry.py) and must name the model, not the arm.
# The arm identity lives in the run-directory name, exactly as epi_bald_greedy
# and dir00_s42 both carry `name: fm_ensemble`.
#
# Two things differ from bnn_mfvi_reg.yaml, both deliberate:
#   probability   posterior_endpoint_mc instead of endpoint_mc. A strict
#                 superset (the backend subclasses it), adding the
#                 estimate_members() surface that decomp_epi_bald requires.
#   hidden_dims   per-system instead of the flat [256, 512, 256]. That flat
#                 default is the PENDULUM entry; on quad3d it puts a
#                 pendulum-sized net against millions of rows. Same defect
#                 bnn_mfvi_a1 was written to fix, and bnn_mfvi_a1 is the arm
#                 this one sits beside in the table.
#
# Every other key must stay equal to bnn_mfvi_reg.yaml. A test enforces that.
defaults:
  - /probability: posterior_endpoint_mc
predictor:
  type: generative          # family tag: endpoint data, endpoint-MC backend, fast eval branch
  name: bnn_mfvi_reg        # arm name: keys the export registry
  trainer_target: adaptive_roa.adaptive_v2.trainers.final_state_trainer.FinalStateTrainer
  batch_size: 1024
  val_batch_size: 2048
  final_state:
    posterior: mfvi
    hidden_dims: ${model_dims.mlp_hidden_dims}
    lr: 1.0e-3
    weight_decay: 1.0e-5
    max_epochs: 200
    patience: 20
    # Isotropic N(0, 1) prior over EVERY layer's weights, via the VILinear KL
    # term (bayesian_mlp.py:66-71). NOT identical to the other arms: laplace
    # applies the same prior to the last layer only, and mlp_det /
    # bnn_ensemble_reg do not consume prior_sigma at all. See mlp_det.yaml.
    prior_sigma: 1.0
    kl_weight: 1.0          # beta = 1: untempered. Any other value is a TEMPERED result.
    beta_nll: 0.5           # Seitzer et al. 2022; 0.0 is plain Gaussian NLL
  lightning_trainer:
    gradient_clip_val: 1.0
    log_every_n_steps: 10
