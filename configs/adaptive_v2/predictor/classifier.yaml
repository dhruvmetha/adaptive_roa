# @package _global_
defaults:
  - /probability: classifier_prob
threshold:
  decision_rule: one_sided
calibration:
  decision_rule: one_sided
predictor:
  type: classifier
  trainer_target: adaptive_roa.adaptive_v2.trainers.classifier_trainer.ClassifierTrainer
  batch_size: 1024
  val_batch_size: 2048
  classifier:
    hidden_dims: [256, 512, 256]
    dropout: 0.0
    lr: 1.0e-3
    weight_decay: 1.0e-5
    max_epochs: 200
    patience: 20
  lightning_trainer:
    gradient_clip_val: 1.0
    log_every_n_steps: 10
