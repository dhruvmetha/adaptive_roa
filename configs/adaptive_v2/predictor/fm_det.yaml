# @package _global_
# Flow matching for the det-paper rerun (EXPERIMENT_TRACKER D17-D19): one model
# (no ensemble), the system UNet from prediction_mode/global, and GRAPE's
# training schedule instead of generative.yaml's 1000 epochs / patience 100.
# GRAPE measured the shorter schedule 1.94x faster with a val-loss cost below
# its member-to-member spread (fm_ensemble.yaml). No last.ckpt: runs never warm
# start and resume reads the best checkpoint, so it only doubles the storage.
# `name` stays `fm`, so the export registry and existing tooling still key on it.
defaults:
  - generative

predictor:
  lightning_trainer:
    max_epochs: 200
    callbacks:
      - _target_: lightning.pytorch.callbacks.ModelCheckpoint
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: false
        filename: "best-{epoch:02d}-{val_loss:.4f}"
        auto_insert_metric_name: false
      - _target_: lightning.pytorch.callbacks.EarlyStopping
        monitor: val_loss
        mode: min
        patience: 30
        verbose: true
        min_delta: 0.0001
