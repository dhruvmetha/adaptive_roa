# @package _global_
# Deep ensemble of flow matchers, members trained one per GPU in parallel.
# Requires n_members GPUs on the node.
defaults:
  - /probability: ensemble_endpoint_mc
predictor:
  type: generative
  name: fm_ensemble
  trainer_target: adaptive_roa.adaptive_v2.trainers.ensemble_flow_matching_trainer.EnsembleFlowMatchingTrainer
  batch_size: 1024
  val_batch_size: 2048
  ensemble:
    n_members: 5
  flow_matching:
    latent_dim: ${flow_matching.latent_dim}
    num_integration_steps: 100
    mae_val_frequency: 10
    use_loss_weights: false
    use_log_loss_weights: false
    use_manifold: false
    clamp_noise: false
    zero_latent: true
    noise_scale: 1.0
    quat_loss_weight: 1.0
  lightning_trainer:
    max_epochs: 200
    accelerator: gpu
    devices: 1
    precision: 32
    gradient_clip_val: 1.0
    log_every_n_steps: 10
    check_val_every_n_epoch: 1
    enable_progress_bar: true
    enable_model_summary: true
    callbacks:
      - _target_: lightning.pytorch.callbacks.ModelCheckpoint
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: "best-{epoch:02d}-{val_loss:.4f}"
        auto_insert_metric_name: false
      - _target_: lightning.pytorch.callbacks.EarlyStopping
        monitor: val_loss
        mode: min
        # patience=100 against max_epochs=200 never fired: with min_delta=1e-4 on a
        # val_loss of ~0.44, noise-level "improvements" kept resetting the counter, so
        # members ran a mean of 185/200 epochs and 84-89% of training happened after the
        # model was already within 1% of its eventual best.
        #
        # Replaying Lightning's EarlyStopping over 30 real member curves:
        #   patience  stop epoch  speedup  val_loss cost  vs member-to-member SD
        #        100         185    1.00x              -                       -
        #         30          96    1.94x        +0.0009                   0.91x
        #         20          72    2.57x        +0.0014                   1.45x
        #         10          35    5.28x        +0.0045                   4.57x
        # 30 is the last row whose accuracy cost stays BELOW the member-to-member
        # spread, i.e. below the noise the pooled run-to-run floor already absorbs.
        # Going to 20 buys 1.3x more speed at a cost that exceeds that spread and
        # would start inflating the floor the verdicts are measured against.
        patience: 30
        verbose: true
        min_delta: 0.0001
