# @package _global_
defaults:
  - /probability: gp
threshold:
  decision_rule: one_sided
  optimize_objective: fixed
  fixed_lambda_star: 0.5
  fixed_delta_star: 0.1
calibration:
  decision_rule: one_sided
predictor:
  type: classifier                      # reuse classification data path + skips
  trainer_target: adaptive_roa.partx.trainer.GPPredictorTrainer
  gp:
    n_inducing: 128
    kernel: matern52
    n_iters: 300
    lr: 0.1
