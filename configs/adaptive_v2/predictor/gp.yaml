# @package _global_
defaults:
  - /probability: gp
threshold:
  decision_rule: one_sided
  optimize_objective: fixed
  fixed_lambda_star: 0.5
  fixed_delta_star: 0.1
calibration:
  decision_rule: one_sided
predictor:
  # No `name:` here on purpose: no ProbabilisticClassifier is registered for
  # the GP predictor yet, so claiming an arm name (e.g. "gp") would make
  # export_run's registry lookup raise KeyError instead of falling back to
  # the "classifier" family alias. Add `name: gp` once a GP export wrapper
  # (checkpoint load + predict) is registered under that name.
  type: classifier                      # reuse classification data path + skips
  trainer_target: adaptive_roa.partx.trainer.GPPredictorTrainer
  gp:
    n_inducing: 128
    kernel: matern52
    n_iters: 300
    lr: 0.1
