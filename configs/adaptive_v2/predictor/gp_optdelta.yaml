# @package _global_
defaults:
  - /probability: gp
threshold:
  decision_rule: one_sided
  optimize_mode: delta
  optimize_objective: loss
calibration:
  decision_rule: one_sided
predictor:
  type: classifier                      # reuse classification data path + skips
  name: gp_optdelta
  trainer_target: adaptive_roa.partx.trainer.GPPredictorTrainer
  gp:
    n_inducing: 128
    kernel: matern52
    n_iters: 300
    lr: 0.1
