# @package _global_

seed: 42
exp_dir: ${exp_dir:}
data_dir: ${data_dir:}
# Dataset noise regime: "deterministic" (default) or "noisy". Trajectory data lives
# under ${data_dir}/${noise_regime}/${dataset_name}/... Override on the CLI
# (e.g. noise_regime=noisy) together with a matching dataset_name for noisy runs.
noise_regime: deterministic
training_index: 0
device: cuda:0

# Experiment identifier embedded in output_dir so a run's directory names itself.
# Defaults to the scheduler job id, which ties the output dir to its slurm log
# (slurm_logs/%x_%j.out); falls back to "local" for unscheduled runs. Override on
# the CLI to tag a campaign, e.g. exp_id=dispersion_sweep.
exp_id: ${oc.env:SLURM_JOB_ID,local}

use_manifold: false
use_loss_weights: false
use_log_loss_weights: false
noise_scale: 1.0
quat_loss_weight: 1.0

val_ratio: 0.2
test_ratio: 0

adaptive_v2:
  filter_confident_pairs: true
  filter_min_pairs: 100

initial_train_size: 300
n_epochs: 10
samples_per_epoch: 100
warm_start: false
eval_every: 1

num_workers: 4

# Default eval-row cap (null = load all). Lives here (not in eval/full_roa.yaml)
# because the eval group loads after the system group; per-system overrides
# (e.g. humanoid_standup_reach sets eval.max_eval_rows: 50000) must win.
eval:
  max_eval_rows: null

flow_matching:
  latent_dim: 0
  num_integration_steps: 100
  mae_val_frequency: 10
  use_loss_weights: ${use_loss_weights}
  use_log_loss_weights: ${use_log_loss_weights}
  quat_loss_weight: ${quat_loss_weight}
  use_manifold: ${use_manifold}
  clamp_noise: false
  zero_latent: true
  noise_scale: ${noise_scale}

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  weight_decay: 1e-5
  betas: [0.9, 0.999]

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 10
  min_lr: 1e-6
