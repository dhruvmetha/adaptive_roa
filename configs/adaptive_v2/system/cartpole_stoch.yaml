# @package _global_

# Stochastic cartpole (LQR + noisy action).
# Datasets: ${data_dir}/stochastic/cartpole/noisy_action/lqr/sigma_{000.0,015.0,020.0,030.0,040.0}
# npz-backed training pool (train.npz) + probabilistic 5-col eval/cal/test files
# (x, theta, x_dot, theta_dot, p_success).
#
# REPOINTED 2026-08-17 from noisy_action/sigma_* to noisy_torque/lqr/{low,med,high}.
# Measured coupling (116,242 traj) -- the length coupling INVERTS vs pendulum:
#   level  traj_succ  L_succ  L_fail  ratio  PAIR_succ
#   low      0.141      617      60   0.10     0.633
#   med      0.099      640     102   0.16     0.410
#   high     0.039      652     154   0.24     0.148
# Successes are the LONG rollouts here, so the yield weight steers toward the
# RARE class. Data labels success as an L2 ball of radius 0.05 over the full 4-D
# state (entry-cut); attractor_radius is deliberately left at 0.2 (decision
# 2026-08-17).
#
# Usage: system=cartpole_stoch noise_level=med acquisition.d2_ratio=0
#
# This is the cartpole analogue of pendulum_stoch. Verified 2026-08-10 against the
# pendulum reference before launch:
#   * train.npz carries the SAME keys (states/offsets/starts/labels/seeds), 4-D
#     states instead of 2-D, 100k rollouts vs pendulum's 300k.
#   * eval_success_prob.npz carries starts/successes/trials/p_success -- exactly the
#     four arrays scripts/stoch_prob_metrics.py reads (it matches predictions to
#     ground truth with a cKDTree nearest-neighbour query, so it is dimension
#     agnostic). Cartpole lacks pendulum's grid_theta/grid_theta_dot/grid_shape,
#     but those are 2-D plotting metadata and are NOT read by the scorer.
#   * 131,859 eval points vs pendulum's 49,770.
#
# NOISE AXIS DIFFERS FROM PENDULUM. Pendulum uses named levels {low,med,high,xhigh};
# cartpole uses sigma directories. sigma_000.0 is the zero-noise baseline, so it is
# the cartpole analogue of `det`, NOT of `low`. Do not map the two systems' levels
# onto each other by position.

defaults:
  - _base
  - /model/system_dims: cartpole_pybullet
  - /prediction_mode: global
  - _self_

name: adaptive_cartpole_stoch_${noise_level}
output_dir: ${exp_dir}/${name}/outputs/training_index_${training_index}_d2_ratio_${acquisition.d2_ratio}_warm_start_${warm_start}_adapt_iter_${n_epochs}_sampling_mode_${sampling_mode}/${now:%Y-%m-%d_%H-%M-%S}

shuffle_variant: 0

noise_regime: stochastic
# Noise sigma: sigma_000.0 | sigma_015.0 | sigma_020.0 | sigma_030.0 | sigma_040.0
# Noise level: low | med | high
noise_level: med
dataset_name: cartpole/noisy_torque/lqr/${noise_level}
dataset_root: ${data_dir}/${noise_regime}/${dataset_name}

# Kept from cartpole_pybullet: cartpole's ROA is two-sided and its attractor
# radius is 0.2, unlike the pendulum's one-sided 0.1. These are system
# properties, not noise-regime properties, so they carry over unchanged.
decision_rule: two_sided
attractor_radius: 0.2

threshold:
  optimize_mode: joint

data_source:
  pool_format: npz
  trajectories_dir: ${dataset_root}/train.npz
  shuffled_indices_file: ${dataset_root}/train_test_splits/shuffled_indices_${shuffle_variant}.txt
  shuffled_labels_file: ${dataset_root}/train_test_splits/shuffled_labels_${shuffle_variant}.txt
  eval_states_file: ${dataset_root}/eval_states.txt
  cal_set_file: ${dataset_root}/cal_set.txt
  test_set_file: ${dataset_root}/test_set.txt

initial_train_size: 1000
n_epochs: 19
samples_per_epoch: 1000

flow_matching:
  clamp_noise: false

system:
  _target_: adaptive_roa.systems.cartpole.CartPoleSystem
  dataset_dir: ${dataset_root}

flow_matcher:
  _target_: adaptive_roa.flow_matching.cartpole.latent_conditional.flow_matcher.CartPoleLatentConditionalFlowMatcher

flow_matcher_local:
  _target_: adaptive_roa.flow_matching.cartpole.trajectory.flow_matcher.CartPoleTrajectoryFlowMatcher

adaptive_v2:
  system_name: cartpole_pybullet
