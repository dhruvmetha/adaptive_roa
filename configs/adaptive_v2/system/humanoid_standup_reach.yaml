# @package _global_

defaults:
  - _base
  - /model/system_dims: humanoid_standup_reach
  - _self_

name: adaptive_humanoid_standup_reach
output_dir: ${exp_dir}/${name}/outputs/training_index_${training_index}_warm_start_${warm_start}_manifold_${use_manifold}_adapt_iter_${n_epochs}/${now:%Y-%m-%d_%H-%M-%S}

use_manifold: true

decision_rule: two_sided
attractor_radius: 1.0

# Intermediate-state acquisition (candidate = sub-trajectory start)
candidate_mode: intermediate

data_source:
  base_dir: ${data_dir}/humanoid_get_up_medium
  trajectories_dir: ${data_source.base_dir}/trajectories
  train_test_splits_dir: ${data_source.base_dir}/train_test_splits
  # Use the 150k TRAIN split for acquisition pool (not all_shuffled_*) to prevent
  # train/eval leakage and reduce the pool to a manageable scale for intermediate mode.
  shuffled_indices_file: ${data_source.train_test_splits_dir}/shuffled_indices.txt
  shuffled_labels_file: ${data_source.train_test_splits_dir}/shuffled_labels.txt
  # FPS primary; start_states alternative commented.
  # cal/test point at PRE-SHUFFLED copies so the max_eval_rows front-slice cap (below)
  # is a representative random sample (the raw *_fps.txt are label-ordered along their
  # length, so a front-slice of the raw files biases q_hat + ROA metrics).
  eval_states_file: ${data_source.train_test_splits_dir}/eval_fps.txt
  cal_set_file: ${data_source.train_test_splits_dir}/cal_set_fps_shuffled.txt
  test_set_file: ${data_source.train_test_splits_dir}/test_set_fps_shuffled.txt
  # eval_states_file: ${data_source.train_test_splits_dir}/eval_start_states.txt
  # cal_set_file: ${data_source.train_test_splits_dir}/cal_set_start_states.txt
  # test_set_file: ${data_source.train_test_splits_dir}/test_set_start_states.txt

initial_train_size: 2000
n_epochs: 30
samples_per_epoch: 500

# Explicit zero prevents any local test-set build from the acquisition pool,
# keeping the train-set / FPS eval-set split clean.
test_ratio: 0

eval:
  max_eval_rows: 50000

optimizer:
  lr: 5e-4

system:
  _target_: adaptive_roa.systems.humanoid_standup_reach.HumanoidStandUpReachSystem
  dataset_dir: ${data_dir}/humanoid_get_up_medium

flow_matcher:
  _target_: adaptive_roa.flow_matching.humanoid_standup_reach.latent_conditional.flow_matcher.HumanoidStandUpReachLatentConditionalFlowMatcher

adaptive_v2:
  system_name: humanoid_standup_reach
  # candidate_mode=intermediate extends trajectory tails backward across epochs, so the
  # built train file is NOT append-stable. The ConfidencePairFilter's incremental
  # n_existing_rows prefix optimization assumes append-only growth, so disable it here.
  # (Re-enabling needs a full-recompute filter for intermediate mode — follow-up.)
  filter_confident_pairs: false
