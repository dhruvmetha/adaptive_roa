# @package _global_

defaults:
  - _base
  - /model/system_dims: pendulum
  - /prediction_mode: global
  - _self_

name: adaptive_pendulum_${controller}
output_dir: ${exp_dir}/${name}/outputs/training_index_${training_index}_d2_ratio_${acquisition.d2_ratio}_warm_start_${warm_start}_adapt_iter_${n_epochs}_sampling_mode_${sampling_mode}_selection_${oc.select:acquisition.selection_rule,none}_exp_${exp_id}/${now:%Y-%m-%d_%H-%M-%S}

shuffle_variant: 0

# Pendulum controller variant: lqr | rl | rl-weak. Training data (trajectories
# + train_test_splits) always comes from the controller's own dir. eval_variant
# names the dataset whose cal_set/test_set are used for calibration+evaluation;
# it defaults to the controller dir itself (correct for lqr). To train on the
# RL swing-up task and evaluate on the composition, pass e.g.:
#   system=pendulum_g1 controller=rl eval_variant=rl_to_lqr
controller: lqr
eval_variant: ${controller}
# Det-paper rerun: lqr_failset adds the two failure equilibria (scripts/det_rerun).
dataset_name: pendulum/${controller}_failset
dataset_root: ${data_dir}/${noise_regime}/${dataset_name}
eval_root: ${data_dir}/${noise_regime}/pendulum/${eval_variant}

# Two-sided (det paper): the lqr_failset failure attractors give p_failure its own
# criterion, so failure is p_failure > 1 - lambda + delta, not "not success".
decision_rule: two_sided
attractor_radius: 0.1
# Collector horizon in control steps (dataset_description.json), read by
# data_source.timeout_intermediates=drop through experiment/det_rerun.yaml.
horizon_steps: 502

threshold:
  optimize_mode: joint

# Pool, cal, val and test are disjoint by trajectory (splits_det_rerun/split_manifest.json).
# The run seed picks the pool order, so it also picks the initial set.
data_source:
  split_dir: ${dataset_root}/splits_det_rerun
  pool_format: npz
  trajectories_dir: ${data_source.split_dir}/train.npz
  shuffled_indices_file: ${data_source.split_dir}/pool_order_${seed}.txt
  shuffled_labels_file: ${data_source.split_dir}/pool_labels_${seed}.txt
  eval_states_file: ${data_source.split_dir}/test_set.txt
  cal_set_file: ${data_source.split_dir}/cal_set.txt
  val_set_file: ${data_source.split_dir}/val_set.txt
  test_set_file: ${data_source.split_dir}/test_set.txt
  timeout_intermediates: drop   # horizon_steps from splits_det_rerun/train_description.json

initial_train_size: 100
n_epochs: 11            # epoch 0 + 10 adaptive iterations (det paper D03)
samples_per_epoch: 50

flow_matching:
  clamp_noise: true
  use_log_loss_weights: false

system:
  _target_: adaptive_roa.systems.pendulum.PendulumSystem
  dataset_dir: ${dataset_root}
  # Failure balls around the two equilibria where saturated torque balances
  # gravity: label radius 0.05 plus the D12 buffer of 0.1. Success keeps
  # attractor_radius 0.1 (label 0.075, kept at 0.1 by ruling).
  failure_radius: 0.15
  failure_theta: 2.0946   # measured over 4,915 settled endpoints, std 0.0013

flow_matcher:
  _target_: adaptive_roa.flow_matching.pendulum.latent_conditional.flow_matcher.PendulumLatentConditionalFlowMatcher

flow_matcher_local:
  _target_: adaptive_roa.flow_matching.pendulum.trajectory.flow_matcher.PendulumTrajectoryFlowMatcher

adaptive_v2:
  system_name: pendulum
