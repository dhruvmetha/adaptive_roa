# @package _global_

# Stochastic pendulum, GAUSSIAN SIGNAL noise (LQR).
#
# REPOINTED 2026-08-17 from the obsolete noisy/pendulum/lqr family to
# stochastic/pendulum/gaussian_signal/lqr.  xdot = f(x, sat(u) + w),
# w ~ N(0, alpha + beta*|u|) as a STANDARD DEVIATION, applied AFTER saturation,
# so the applied torque can exceed u_sat and the ROA is not a subset of the
# deterministic one.  low a.05 b.16 | med a.10 b.64 | high a.20 b1.00.
#
# Measured coupling (train.npz, 100k trajectories) -- what the yield weight keys
# on, same DIRECTION as the old family:
#   level  traj_succ  L_succ  L_fail  ratio  PAIR_succ
#   low      0.386      152     801   5.28     0.106
#   med      0.406      147     801   5.44     0.111
#   high     0.547      234     801   3.42     0.261
# Failures run to the 800-step horizon, successes stop on goal entry, so the
# pool is ~40% success by TRAJECTORY but only ~11% by PAIR.
#
# The data labels success as a PER-CHANNEL BOX (|theta|<0.05 and |theta_dot|
# <0.05, hold 1, entry-cut).  attractor_radius below is deliberately left at
# 0.1 (decision 2026-08-17) -- do not "fix" it without saying so.
#
# Be clear about what that costs, because it is NOT cosmetic: attractor_radius
# is what endpoint_mc_probabilities uses to label each of the K sampled
# endpoints, so it DEFINES the model's predicted p_success and therefore feeds
# straight into sAUROC / KL / recal.  is_in_attractor is a distance BALL, not a
# box, so a ball of r=0.1 covers area 0.0314 against the labelling box's 0.0100
# -- 3.1x more permissive.  Predicted p_success is systematically inflated and
# there is a floor under achievable KL.  Every arm shares the bias, so the
# ranking should survive, but the magnitudes are not comparable to a run scored
# at r=0.05.
# Datasets: ${data_dir}/stochastic/pendulum/gaussian_signal/lqr/{low,med,high} — npz-backed
# training pool (train.npz) + probabilistic 3-col eval/cal/test files
# (θ_s, θ̇_s, p_success). See scripts/prepare_stochastic_pendulum.py.
#
# Usage: system=pendulum_stoch noise_level=med acquisition.d2_ratio=0

defaults:
  - _base
  - /model/system_dims: pendulum
  - /prediction_mode: global
  - _self_

name: adaptive_pendulum_stoch_${noise_level}
output_dir: ${exp_dir}/${name}/outputs/training_index_${training_index}_d2_ratio_${acquisition.d2_ratio}_warm_start_${warm_start}_adapt_iter_${n_epochs}_sampling_mode_${sampling_mode}/${now:%Y-%m-%d_%H-%M-%S}

shuffle_variant: 0

noise_regime: stochastic
# Noise level: low | med | high
noise_level: med
# Controller branch of the data tree. pendulum/gaussian_signal ships only `lqr`.
controller: lqr
dataset_name: pendulum/gaussian_signal/${controller}/${noise_level}
dataset_root: ${data_dir}/${noise_regime}/${dataset_name}

decision_rule: one_sided
attractor_radius: 0.1

threshold:
  optimize_mode: joint

data_source:
  pool_format: npz
  trajectories_dir: ${dataset_root}/train.npz
  shuffled_indices_file: ${dataset_root}/train_test_splits/shuffled_indices_${shuffle_variant}.txt
  shuffled_labels_file: ${dataset_root}/train_test_splits/shuffled_labels_${shuffle_variant}.txt
  eval_states_file: ${dataset_root}/eval_states.txt
  cal_set_file: ${dataset_root}/cal_set.txt
  test_set_file: ${dataset_root}/test_set.txt

# v2 datasets (2026-07-25): 300k train rollouts from uniform-random unique
# starts — plain rollout-level shuffle, no block structure. Eval/cal/test are
# 3-col (theta, theta_dot, p_success) grid files with ~90 rollouts per cell.
initial_train_size: 1000
n_epochs: 19
samples_per_epoch: 1000

flow_matching:
  clamp_noise: true
  use_log_loss_weights: false

system:
  _target_: adaptive_roa.systems.pendulum.PendulumSystem
  dataset_dir: ${dataset_root}

flow_matcher:
  _target_: adaptive_roa.flow_matching.pendulum.latent_conditional.flow_matcher.PendulumLatentConditionalFlowMatcher

flow_matcher_local:
  _target_: adaptive_roa.flow_matching.pendulum.trajectory.flow_matcher.PendulumTrajectoryFlowMatcher

adaptive_v2:
  system_name: pendulum
