# @package _global_

defaults:
  - _base
  - /model/system_dims: quadrotor2d
  - /prediction_mode: global
  - _self_

name: adaptive_quadrotor2d
output_dir: ${exp_dir}/${name}/outputs/training_index_${training_index}_d2_ratio_${acquisition.d2_ratio}_warm_start_${warm_start}_manifold_${use_manifold}_adapt_iter_${n_epochs}_sampling_mode_${sampling_mode}_selection_${oc.select:acquisition.selection_rule,none}_exp_${exp_id}/${now:%Y-%m-%d_%H-%M-%S}

decision_rule: two_sided
attractor_radius: 0.3

dataset_name: quadrotor2D_rl
dataset_root: ${data_dir}/${noise_regime}/${dataset_name}

data_source:
  base_dir: ${dataset_root}
  trajectories_dir: ${data_source.base_dir}/trajectories
  train_test_splits_dir: ${data_source.base_dir}/train_test_splits
  shuffled_indices_file: ${data_source.train_test_splits_dir}/shuffled_indices_${training_index}.txt
  shuffled_labels_file: ${data_source.train_test_splits_dir}/shuffled_labels_${training_index}.txt
  eval_states_file: ${data_source.base_dir}/eval_states.txt
  cal_set_file: ${data_source.base_dir}/cal_set.txt
  test_set_file: ${data_source.base_dir}/test_set.txt

initial_train_size: 2000
samples_per_epoch: 500
n_epochs: 201

flow_matching:
  clamp_noise: false

system:
  _target_: adaptive_roa.systems.quadrotor2d.Quadrotor2DSystem
  dataset_dir: ${dataset_root}

flow_matcher:
  _target_: adaptive_roa.flow_matching.quadrotor_2d.latent_conditional.flow_matcher.Quadrotor2DLatentConditionalFlowMatcher

flow_matcher_local:
  _target_: adaptive_roa.flow_matching.quadrotor_2d.trajectory.flow_matcher.Quadrotor2DTrajectoryFlowMatcher

adaptive_v2:
  system_name: quadrotor2d
