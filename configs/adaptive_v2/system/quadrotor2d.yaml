# @package _global_

defaults:
  - _base
  - /model/system_dims: quadrotor2d
  - /prediction_mode: global
  - _self_

name: adaptive_quadrotor2d
output_dir: ${exp_dir}/${name}/outputs/training_index_${training_index}_d2_ratio_${acquisition.d2_ratio}_warm_start_${warm_start}_manifold_${use_manifold}_adapt_iter_${n_epochs}_sampling_mode_${sampling_mode}_selection_${oc.select:acquisition.selection_rule,none}_exp_${exp_id}/${now:%Y-%m-%d_%H-%M-%S}

decision_rule: two_sided
attractor_radius: 0.3
# Collector horizon in control steps (dataset_description.json), read by
# data_source.timeout_intermediates=drop through experiment/det_rerun.yaml.
horizon_steps: 1200

dataset_name: quadrotor2D_rl
dataset_root: ${data_dir}/${noise_regime}/${dataset_name}

# Pool, cal, val and test are disjoint by trajectory (splits_det_rerun/split_manifest.json).
# The run seed picks the pool order, so it also picks the initial set.
data_source:
  base_dir: ${dataset_root}
  train_test_splits_dir: ${data_source.base_dir}/train_test_splits
  split_dir: ${data_source.base_dir}/splits_det_rerun
  pool_format: npz
  trajectories_dir: ${data_source.split_dir}/train.npz
  shuffled_indices_file: ${data_source.split_dir}/pool_order_${seed}.txt
  shuffled_labels_file: ${data_source.split_dir}/pool_labels_${seed}.txt
  eval_states_file: ${data_source.split_dir}/test_set.txt
  cal_set_file: ${data_source.split_dir}/cal_set.txt
  val_set_file: ${data_source.split_dir}/val_set.txt
  test_set_file: ${data_source.split_dir}/test_set.txt
  timeout_intermediates: drop
  horizon_steps: 1200   # dataset_description max_steps; no det trajectory here times out

initial_train_size: 2000
samples_per_epoch: 1000
# Stop once the training set reaches 12k trajectories: 2000 + 500*20 = 12,000.
# (Was 201, which requested 102,500 — far beyond the ~16k available after the
# 0.2 val split, so every epoch past ~28 retrained on an exhausted pool.)
n_epochs: 11            # epoch 0 + 10 adaptive iterations (det paper D03)

flow_matching:
  clamp_noise: false

system:
  _target_: adaptive_roa.systems.quadrotor2d.Quadrotor2DSystem
  dataset_dir: ${dataset_root}

flow_matcher:
  _target_: adaptive_roa.flow_matching.quadrotor_2d.latent_conditional.flow_matcher.Quadrotor2DLatentConditionalFlowMatcher

flow_matcher_local:
  _target_: adaptive_roa.flow_matching.quadrotor_2d.trajectory.flow_matcher.Quadrotor2DTrajectoryFlowMatcher

adaptive_v2:
  system_name: quadrotor2d
