# Comparison of Adaptive method vs Non-Adaptive Baselines - Pendulum
# Use with: python scripts/adaptive_metrics_plotter.py --config configs/adaptive_vs_baselines_pendulum.yaml

adaptive_experiments:
  - name: "Conformal Adaptive (Ours)"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_pendulum_dhruv/outputs/training_index_0_d2_ratio_0.5_warm_start_False_threshold_mode_dynamic_adapt_iter_19_alpha_0.1_sampling_mode_ranked/2026-01-30_14-07-37/evaluations/batch_81920/metrics"

non_adaptive_experiments:
  - name: "Conformal Non-Adaptive (Ours)"
    scores:
      f1: 0.995
      separatrix_pct: 0.047
  - name: "Classification"
    scores:
      f1: 0.985
      separatrix_pct: 0.01
  - name: "Non-Generative Final State Predictor"
    scores:
      f1: 0.0
      separatrix_pct: 0.0
  - name: "NeuroMancer"
    scores:
      f1: 0.919
      separatrix_pct: 0.513
  - name: "MORALS"
    scores:
      f1: 0.939
      separatrix_pct: 0.073

metrics_to_plot:
  - f1
  - separatrix_pct

y_labels:
  f1: "F1"
  separatrix_pct: "Separatrix %"

# Only show legend on F1 plot
legend_on_metrics:
  - f1

# Fixed axis scales
y_min: 0
y_max: 1

# Sync first epoch to use max value across experiments
sync_first_epoch: false

# Figure size (square)
figsize: [8, 8]

output_dir: "./plots/adaptive_vs_baselines_pendulum"
output_format: "png"
