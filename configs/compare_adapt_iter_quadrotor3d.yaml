# Comparison of different adapt_iter values - Quadrotor 3D
# Use with: python scripts/adaptive_metrics_plotter.py --config configs/compare_adapt_iter_quadrotor3d.yaml

adaptive_experiments:
  - name: "# Samples per Iteration = 250"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_quadrotor3d/outputs/training_index_0_d2_ratio_0.75_warm_start_False_manifold_False_threshold_mode_dynamic_adapt_iter_40_alpha_0.1_sampling_mode_ranked/2026-01-29_07-38-07/evaluations/batch_81920/metrics"
  - name: "# Samples per Iteration = 500"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_quadrotor3d/outputs/training_index_0_d2_ratio_0.75_warm_start_False_manifold_False_threshold_mode_dynamic_adapt_iter_20_alpha_0.1_sampling_mode_ranked/2026-01-29_07-38-04/evaluations/batch_61440/metrics"

metrics_to_plot:
  - f1
  - separatrix_pct

y_labels:
  f1: "F1"
  separatrix_pct: "Separatrix %"

# Only show legend on F1 plot
legend_on_metrics:
  - f1

# Fixed axis scales
x_max: 6000

# Sync first epoch to use max value across experiments
sync_first_epoch: true

# Figure size (square)
figsize: [8, 8]

output_dir: "./plots/adapt_iter_comparison_quadrotor3d"
output_format: "png"
