# Comparison of Uncertain-Uniform sampling ratio experiments - Quadrotor 3D
# Use with: python scripts/adaptive_metrics_plotter.py --config configs/compare_d2_ratio_quadrotor3d.yaml

adaptive_experiments:
  - name: "Uncertain-Uniform Ratio = 0.75"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_quadrotor3d/outputs/training_index_0_d2_ratio_0.75_warm_start_False_manifold_False_threshold_mode_dynamic_adapt_iter_40_alpha_0.1_sampling_mode_ranked/2026-01-29_07-38-07/evaluations/batch_81920/metrics"
  - name: "Uncertain-Uniform Ratio = 0.5"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_quadrotor3d/outputs/training_index_0_d2_ratio_0.5_warm_start_False_manifold_False_threshold_mode_dynamic_adapt_iter_40_alpha_0.1_sampling_mode_ranked/2026-01-29_07-35-48/evaluations/batch_81920/metrics"
  - name: "Uncertain-Uniform Ratio = 0"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_quadrotor3d/outputs/training_index_0_d2_ratio_0_warm_start_False_manifold_False_threshold_mode_dynamic_adapt_iter_40_alpha_0.1_sampling_mode_ranked/2026-01-29_08-08-36/evaluations/batch_81920/metrics"

metrics_to_plot:
  - f1
  - separatrix_pct

y_labels:
  f1: "F1"
  separatrix_pct: "Separatrix %"

# Only show legend on separatrix plot
legend_on_metrics:
  - separatrix_pct

# Fixed axis scales
x_max: 6000

# Sync first epoch to use max value across experiments
sync_first_epoch: true

# Figure size [width, height]
figsize: [10, 8]

output_dir: "./plots/d2_ratio_comparison_quadrotor3d"
output_format: "png"
