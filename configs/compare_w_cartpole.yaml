# Comparison of different w values - CartPole
# Use with: python scripts/adaptive_metrics_plotter.py --config configs/compare_w_cartpole.yaml

adaptive_experiments:
  - name: "w = 0.5"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_cartpole_pybullet/outputs/training_index_0_d2_ratio_0.5_warm_start_False_manifold_False_threshold_mode_dynamic_adapt_iter_8_alpha_0.1_sampling_mode_ranked_w_0.5/2026-01-30_21-28-09/evaluations/batch_61440/metrics"
  - name: "w = 0.9"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_cartpole_pybullet/outputs/training_index_0_d2_ratio_0.5_warm_start_True_manifold_False_threshold_mode_dynamic_adapt_iter_10_alpha_0.1_sampling_mode_ranked/2026-01-30_13-48-34/evaluations/batch_61440/metrics"
  - name: "w = 0.99"
    metrics_dir: "/common/users/shared/pracsys/adaptive_roa_experiments/adaptive_cartpole_pybullet/outputs/training_index_0_d2_ratio_0.5_warm_start_False_manifold_False_threshold_mode_dynamic_adapt_iter_8_alpha_0.1_sampling_mode_ranked_w_0.99/2026-01-30_21-34-17/evaluations/batch_61440/metrics"

metrics_to_plot:
  - f1
  - separatrix_pct

y_labels:
  f1: "F1"
  separatrix_pct: "Separatrix %"

# Show legend on these plots
legend_on_metrics:
  - f1
  - separatrix_pct

# Fixed axis scales
x_max: 1000
y_min: 0
y_max: 1

# Sync first epoch to use max value across experiments
sync_first_epoch: true

# Figure size (square)
figsize: [8, 8]

output_dir: "./plots/w_comparison_cartpole"
output_format: "png"
