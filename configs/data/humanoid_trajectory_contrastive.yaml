# Humanoid Trajectory Contrastive Data Configuration
_target_: src.data.trajectory_contrastive_data.TrajectoryContrastiveDataModule

# Trajectory directories (single dir, will be split into train/val)
train_trajectory_dir: /common/users/shared/pracsys/genMoPlan/data_trajectories/humanoid_get_up/trajectories
val_trajectory_dir: null   # Not used when use_split=true
test_trajectory_dir: null  # Not used when use_split=true

# State dimension
state_dim: 67  # Humanoid: ℝ³⁴ × S² × ℝ³⁰

# Contrastive learning settings
temporal_window: 3   # ±k timesteps for positive sampling (reduced for harder task)
num_negatives: 5     # Number of negative samples per anchor (increased for harder task)

# Train/Val split settings (disjoint trajectories)
use_split: true           # Enable automatic train/val split
val_split_ratio: 0.15     # 15% for validation (1500 trajectories)
seed: ${seed}             # Use global seed for reproducibility

# Dataset size limits (for faster iteration)
max_trajectories_train: null  # Use all train split trajectories
max_trajectories_val: null    # Use all val split trajectories
max_trajectories_test: 500    # Use subset for testing
trajectory_subsample: 1       # Load every Nth trajectory (1 = all)

# DataLoader settings
batch_size: ${batch_size}
val_batch_size: ${batch_size}
num_workers: 4
pin_memory: true
cache_trajectories: true  # Cache in memory for faster loading
