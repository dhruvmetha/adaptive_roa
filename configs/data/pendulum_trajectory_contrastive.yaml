# Pendulum Trajectory Contrastive Data Configuration
_target_: src.data.trajectory_contrastive_data.TrajectoryContrastiveDataModule

# Trajectory directories
train_trajectory_dir: /common/users/shared/pracsys/genMoPlan/data_trajectories/pendulum_lqr_50k/trajectories
val_trajectory_dir: /common/users/shared/pracsys/genMoPlan/data_trajectories/pendulum_lqr_50k/trajectories
test_trajectory_dir: /common/users/shared/pracsys/genMoPlan/data_trajectories/pendulum_lqr_50k/trajectories

# State dimension
state_dim: 2  # Pendulum: S¹ × ℝ (θ, θ̇)

# Contrastive learning settings
temporal_window: 10
num_negatives: 1

# Dataset size limits
max_trajectories_train: 10000
max_trajectories_val: 1000
max_trajectories_test: 1000
trajectory_subsample: 1

# DataLoader settings
batch_size: ${batch_size}
val_batch_size: ${batch_size}
num_workers: 4
pin_memory: true
cache_trajectories: true
