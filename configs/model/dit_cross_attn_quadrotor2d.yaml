# DiT Cross-Attention for Quadrotor 2D (R2 x S1 x R3 manifold)
_target_: adaptive_roa.model.dit_cross_attention.DiTCrossAttentionModel

# Quadrotor 2D dimensions
embedded_dim: 7       # [x, y, sin(theta), cos(theta), vx, vy, omega] (7D embedded)
latent_dim: 0         # No latent variable for quadrotor 2D
condition_dim: 7      # Same as embedded_dim (start state condition)
time_emb_dim: 64      # Sinusoidal time embedding dimension
output_dim: 6         # 6D tangent velocity [dx, dy, dtheta, dvx, dvy, domega]

# DiT architecture
token_dim: 128        # Common token width
n_heads: 4            # Number of attention heads
num_blocks: 4         # Number of DiT blocks
mlp_ratio: 4          # FFN expansion ratio
cond_proj_dim: 256    # AdaLN conditioning dim
dropout: 0.0

# Component tokenization: [position(x,y), orientation(sin,cos,theta), velocity(vx,vy,omega)]
state_component_dims: [2, 3, 2]
condition_component_dims: [2, 3, 2]
output_component_dims: [2, 1, 3]
