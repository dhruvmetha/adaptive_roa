_target_: adaptive_roa.model.dit_flow.DiTFlowModel

# CartPole dimensions
embedded_dim: 5        # (x_norm, ẋ_norm, sin θ, cos θ, θ̇_norm) = 5 tokens
latent_dim: 2          # Will be overridden by flow_matching.latent_dim
condition_dim: 5       # Start state conditioning = 5 tokens
time_emb_dim: 64
output_dim: 4          # (dx/dt, dẋ/dt, dθ/dt, dθ̇/dt) tangent space

# Architecture
hidden_dim: 192
num_blocks: 4
num_heads: 4
cond_dim: 192
mlp_ratio: 4
dropout: 0.0
