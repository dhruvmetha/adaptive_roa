_target_: adaptive_roa.model.dit_flow.DiTFlowModel

# Pendulum dimensions
embedded_dim: 3        # (sin θ, cos θ, θ̇) = 3 tokens
latent_dim: 2          # Will be overridden by flow_matching.latent_dim
condition_dim: 3       # Start state conditioning = 3 tokens
time_emb_dim: 64
output_dim: 2          # (dθ/dt, dθ̇/dt) tangent space

# Architecture
hidden_dim: 128
num_blocks: 3
num_heads: 2
cond_dim: 128
mlp_ratio: 4
dropout: 0.0
