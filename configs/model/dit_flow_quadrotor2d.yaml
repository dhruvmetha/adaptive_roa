_target_: adaptive_roa.model.dit_flow.DiTFlowModel

# Quadrotor 2D dimensions
embedded_dim: 7        # (x_norm, z_norm, sin θ, cos θ, ẋ_norm, ż_norm, θ̇_norm) = 7 tokens
latent_dim: 4          # Will be overridden by flow_matching.latent_dim
condition_dim: 7       # Start state conditioning = 7 tokens
time_emb_dim: 64
output_dim: 6          # (dx/dt, dz/dt, dθ/dt, dẋ/dt, dż/dt, dθ̇/dt) tangent space

# Architecture
hidden_dim: 192
num_blocks: 4
num_heads: 4
cond_dim: 192
mlp_ratio: 4
dropout: 0.0
