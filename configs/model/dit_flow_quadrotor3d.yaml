_target_: adaptive_roa.model.dit_flow.DiTFlowModel

# Quadrotor 3D dimensions
embedded_dim: 13       # (x, y, z, qw, qx, qy, qz, ẋ, ẏ, ż, p, q, r) = 13 tokens
latent_dim: 4          # Will be overridden by flow_matching.latent_dim
condition_dim: 13      # Start state conditioning = 13 tokens
time_emb_dim: 64
output_dim: 12         # 12D tangent space (SO(3) has 3D tangent for 4D quaternion)

# Architecture (larger for 13D)
hidden_dim: 256
num_blocks: 6
num_heads: 4
cond_dim: 256
mlp_ratio: 4
dropout: 0.0
