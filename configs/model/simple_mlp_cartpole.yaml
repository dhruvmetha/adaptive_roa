_target_: adaptive_roa.model.simple_flow_mlp.SimpleFlowMLP

# CartPole dimensions
embedded_dim: 5        # (x_norm, ẋ_norm, sin θ, cos θ, θ̇_norm)
latent_dim: 2          # Will be overridden by flow_matching.latent_dim
condition_dim: 5       # Start state conditioning
time_emb_dim: 64
output_dim: 4          # (dx/dt, dẋ/dt, dθ/dt, dθ̇/dt) tangent space

# Architecture
hidden_dims: [256, 512, 1024, 512, 256]
use_input_embeddings: false
input_emb_dim: 64
