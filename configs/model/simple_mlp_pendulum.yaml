_target_: adaptive_roa.model.simple_flow_mlp.SimpleFlowMLP

# Pendulum dimensions
embedded_dim: 3        # (sin θ, cos θ, θ̇)
latent_dim: 2          # Will be overridden by flow_matching.latent_dim
condition_dim: 3       # Start state conditioning
time_emb_dim: 64
output_dim: 2          # (dθ/dt, dθ̇/dt) tangent space

# Architecture
hidden_dims: [256, 512, 256]
use_input_embeddings: false
input_emb_dim: 64
