# @package _global_
# Quadrotor 3D. hidden_dims/attractor_radius mirror the adaptive experiment.
system: quadrotor3d
horizon_T: 25
dataset_dir: ${shared_data_base:/common/users/shared/pracsys/genMoPlan/data_trajectories}/partial_deterministic/quadrotor3D_lqr/quadrotor3D_lqr_T${horizon_T}
hidden_dims: [512, 1024, 1024, 512]
attractor_radius: 0.3
eval_split_file: test_set.txt
# Generative FM analog used lr 5e-4 for quad3d/humanoid; deterministic uses 7.5e-4
# (between the generative 5e-4 and the classifier analog's 1e-3).
lr_generative: 5.0e-4
lr_deterministic: 7.5e-4
# Trajectory-pool cap (first N in gold/pool order); horizon count follows per T.
max_trajectories: 25000
