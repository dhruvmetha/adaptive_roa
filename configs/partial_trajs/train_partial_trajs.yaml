# Partial-trajectory deterministic/generative T-step dynamics-model training.
#
# Per-system and per-backend settings live in config groups (values mirror the
# adaptive experiments). Select them on the CLI, e.g.:
#   python adaptive_roa/partial_trajs/train.py system=humanoid_standup_reach
#   python adaptive_roa/partial_trajs/train.py system=cartpole horizon_T=50 backend=deterministic
#
# Group files use `# @package _global_`, so composition flattens into the flat
# top-level keys `train.run(cfg)` reads (system, dataset_dir, hidden_dims, lr, ...).

defaults:
  - backend: generative
  - system: pendulum
  - _self_

# Bounds source for the verifier system; null -> env-default deterministic dir.
system_dataset_dir: null

# Runtime / trainer
seed: 0
val_fraction: 0.2
# Draw the per-system horizon budget (from max_trajectories) as an IID uniform
# sample over the full pool, split by horizon -- a faithful iid training set
# rather than all windows of a few clustered trajectories. false = legacy
# trajectory-cap (all horizons of the first N trajectories, split by trajectory).
iid_horizons: true
accelerator: gpu
devices: 1
enable_checkpointing: true
enable_progress_bar: true
limit_train_batches: 1.0
limit_val_batches: 1.0
eval_max_batches: null  # cap batches for the metric-#1 val report (null = all)

# Checkpointing / logging. No EarlyStopping: these non-adaptive runs train the
# full max_epochs (best-val + last checkpoints are still kept).
gradient_clip_val: 1.0
log_every_n_steps: 10

hydra:
  run:
    # Include ${backend} and T${horizon_T} so a system's generative/deterministic
    # runs and its different-T runs never share a run dir (they can launch in the
    # same wall-clock second and would otherwise collide on checkpoints/).
    dir: outputs/partial_trajs/${system}/${backend}/T${horizon_T}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
