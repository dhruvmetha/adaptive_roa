# Partial-trajectory deterministic T-step dynamics-model training.
# Default: pendulum. Override system/dataset_dir/hidden_dims per system, e.g.
#   system=cartpole dataset_dir=.../cartpole_pybullet/cartpole_pybullet_T25 \
#   hidden_dims='[256,512,1024,512,256]'

# Backbone widths mirror the adaptive flow-MLP per-system mlp_hidden_dims:
#   pendulum  [256,512,256]      cartpole/quad2D [256,512,1024,512,256]
#   quad3D/humanoid [512,1024,1024,512]

system: pendulum
dataset_dir: ${shared_data_base:/common/users/shared/pracsys/genMoPlan/data_trajectories}/partial_deterministic/pendulum_lqr/pendulum_lqr_50k_T25
system_dataset_dir: null  # bounds source; null -> env-default deterministic dir

# Dynamics backend: deterministic (regressor) | generative (conditional flow matching)
backend: deterministic
latent_dim: 1              # generative only
num_integration_steps: 50  # generative only

hidden_dims: [256, 512, 256]
batch_size: 1024
val_fraction: 0.2
seed: 0
lr: 1.0e-3
dropout: 0.0

max_epochs: 200
accelerator: gpu
devices: 1
enable_checkpointing: true
enable_progress_bar: true
limit_train_batches: 1.0
limit_val_batches: 1.0
eval_max_batches: null  # cap batches for the metric-#1 val report (null = all)

hydra:
  run:
    dir: outputs/partial_trajs/${system}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
