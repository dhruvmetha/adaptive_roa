# Humanoid Baseline Training Configuration

# User-specific paths (loaded from .env file via resolvers)
net_id: ${net_id:}
user_base: ${exp_dir:}
arcmg_datasets: ${user_base}/arcmg_datasets

defaults:
  - model: classification/mlp
  - system: humanoid
  - _self_

name: humanoid_baseline_mlp
seed: 42
debug: false
checkpoint_path: null

# System override to use actual bounds
system:
  bounds_file: ${arcmg_datasets}/humanoid_get_up/humanoid_data_bounds.pkl
  use_dynamic_bounds: true

# Data configuration
data:
  file: /common/users/shared/pracsys/genMoPlan/data_trajectories/humanoid_get_up_slow_reach/eval_states.txt
  batch_size: 64
  num_workers: 4
  # Slicing: [start_index, end_index]
  # Total data is 10,000
  train_split: [0, 1000]       # First 1000 for training
  val_split: [1000, 2000]      # Next 500 for validation
  test_split: [0, 10000]     # Same 500 for testing (or use [1500, 2000] if desired)
 
# Training params (used by model/data logic)
training:
  learning_rate: 1e-3

# Trainer configuration (PyTorch Lightning)
trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 500
  accelerator: auto
  devices: 1
  check_val_every_n_epoch: 1  # Disabled in favor of val_check_interval
  val_check_interval: 1        # Validate every 100 batches
  log_every_n_steps: 10
  
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val_loss
      mode: min
      filename: "best-checkpoint-{epoch:02d}-{val_loss:.4f}"
      save_top_k: 1
      save_last: true
      
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val_loss
      patience: 30   # Increased patience
      mode: min
      verbose: true

# Hydra output directory
hydra:
  run:
    dir: outputs/classification/humanoid/mlp/${now:%Y-%m-%d_%H-%M-%S}
