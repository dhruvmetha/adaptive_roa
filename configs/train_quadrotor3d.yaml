# Quadrotor 3D Latent Conditional Flow Matching (Facebook FM)
# Uses: ℝ³ × SO(3) × ℝ⁶ manifold, GeodesicProbPath, RiemannianODESolver
# State: (x, y, z, qw, qx, qy, qz, ẋ, ẏ, ż, p, q, r) - 13D representation
# Tangent: 12D (3 position + 3 rotation + 6 velocity) - SO(3) has 3D tangent space

defaults:
  - system: quadrotor3d
  - _self_

# User-specific paths (loaded from .env file via resolvers)
net_id: ${net_id:}
user_base: ${exp_dir:}
shared_data: ${shared_data_base:/common/users/shared/pracsys/genMoPlan/data_trajectories}

name: quadrotor3d_latent_conditional_fm
seed: 42
batch_size: 256
val_batch_size: 2048  # Validation batch size (can be larger than training)
base_lr: 1e-4
num_workers: 4
latent_dim: 4  # Larger latent dim for 13D state

# Flow Matcher: Facebook FM version with automatic geodesics
flow_matcher:
  _target_: adaptive_roa.flow_matching.quadrotor_3d.latent_conditional.flow_matcher.Quadrotor3DLatentConditionalFlowMatcher
  # Note: system, model, optimizer, scheduler, config, latent_dim are passed by training script

# Model: Latent Conditional UNet for Quadrotor 3D
model:
  _target_: adaptive_roa.model.quadrotor3d_unet.Quadrotor3DUNet
  embedded_dim: 13               # 13D state (position + quaternion + velocities)
  latent_dim: ${latent_dim}      # Gaussian latent variable
  condition_dim: 13              # Embedded start state
  time_emb_dim: 64               # Time embedding dimension
  hidden_dims: [512, 1024, 1024, 512]  # Larger network for 13D state
  output_dim: 12                 # 12D tangent velocity (3 pos + 3 rot + 6 vel)
  use_input_embeddings: false
  input_emb_dim: 128

# Data: Quadrotor 3D endpoint dataset
# Uses shuffled_indices from train_test_splits to load trajectory endpoints
data:
  _target_: adaptive_roa.data.quadrotor3d_endpoint_data.Quadrotor3DEndpointDataModule
  # Shuffled indices mode (uses existing train_test_splits)
  train_indices_file: ${shared_data}/quadrotor3D_lqr/train_test_splits/shuffled_indices_0.txt
  val_indices_file: ${shared_data}/quadrotor3D_lqr/train_test_splits/shuffled_indices_1.txt
  test_indices_file: ${shared_data}/quadrotor3D_lqr/train_test_splits/shuffled_indices_2.txt
  trajectories_dir: ${shared_data}/quadrotor3D_lqr/trajectories
  batch_size: ${batch_size}
  val_batch_size: ${val_batch_size}
  num_workers: ${num_workers}
  dataset_dir: ${shared_data}/quadrotor3D_lqr

# Optimizer: AdamW
optimizer:
  _target_: torch.optim.AdamW
  lr: ${base_lr}
  weight_decay: 1e-5
  betas: [0.9, 0.999]

# Scheduler: Reduce on plateau
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 10
  min_lr: 1e-6

# Trainer: PyTorch Lightning
trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 2000
  accelerator: gpu
  devices: [0]
  precision: 32
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_model_summary: true
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: "${hydra:runtime.output_dir}"
    name: ""
    version: null
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: "${hydra:runtime.output_dir}/version_0/checkpoints"
      monitor: val_loss
      mode: min
      save_top_k: 3
      save_last: true
      filename: "epoch{epoch:02d}-val_loss{val_loss:.4f}"
      auto_insert_metric_name: false
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val_loss
      mode: min
      patience: 500
      verbose: true

# Flow matching specific settings
flow_matching:
  latent_dim: ${latent_dim}          # Dimension of Gaussian latent variable
  num_integration_steps: 100         # ODE solver steps for inference
  mae_val_frequency: 10              # Compute MAE validation every N epochs

# Hydra output directory
hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
