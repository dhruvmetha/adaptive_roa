# =============================================================================
# Quadrotor 3D Classification Training Config
# =============================================================================
# Binary classification: success (1) vs failure (0)
# Uses expanded dataset with all trajectory points.
#
# State: 13D raw -> 13D embedded
#   [x, y, z, qw, qx, qy, qz, x_dot, y_dot, z_dot, p, q, r]
#   Positions/velocities normalized, quaternion kept as unit quaternion
# =============================================================================

name: quadrotor3d_classification
system: quadrotor3d
seed: 42
batch_size: 512
base_lr: 1e-4
weight_decay: 1e-4
num_workers: 4

# Model architecture
# Input: 13D
hidden_channels:
  - 256
  - 512
  - 512
  - 256

# Data paths (relative to project root)
data:
  train_file: data/classification/quadrotor3d/train.txt
  val_file: data/classification/quadrotor3d/val.txt
  test_file: data/classification/quadrotor3d/test.txt
  balance_samples: true

# Trainer config
trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 200
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_model_summary: true
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ""
    version: null
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${hydra:runtime.output_dir}/checkpoints
      monitor: val_loss
      mode: min
      save_top_k: 3
      save_last: true
      filename: epoch{epoch:02d}-val_loss{val_loss:.4f}
      auto_insert_metric_name: false
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val_loss
      mode: min
      patience: 20
      verbose: true

# Hydra output
hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
