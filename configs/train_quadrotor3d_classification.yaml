# Quadrotor 3D Classification Training Config
# Binary classification: success (1) vs failure (0) from initial state
#
# State space (13D):
# - Position: x, y, z (normalized to [-1, 1])
# - Orientation: qw, qx, qy, qz (unit quaternion, NOT normalized)
# - Linear velocity: x_dot, y_dot, z_dot (normalized to [-1, 1])
# - Angular velocity: p, q, r (normalized to [-1, 1])

name: quadrotor3d_classification
seed: 42
batch_size: 256
base_lr: 1e-3
num_workers: 4

# Model architecture (larger than CartPole due to 13D input)
hidden_channels:
  - 512
  - 1024
  - 512

# Data: Quadrotor 3D classification from trajectories
data:
  _target_: src.data.quadrotor3d_classification_data.Quadrotor3DClassificationDataModule
  shuffled_indices_file: /common/users/shared/pracsys/genMoPlan/data_trajectories/quadrotor3D_lqr/train_test_splits/shuffled_indices_0.txt
  shuffled_labels_file: /common/users/shared/pracsys/genMoPlan/data_trajectories/quadrotor3D_lqr/train_test_splits/shuffled_labels_0.txt
  trajectories_dir: /common/users/shared/pracsys/genMoPlan/data_trajectories/quadrotor3D_lqr/trajectories
  batch_size: ${batch_size}
  num_workers: ${num_workers}
  train_split: 0.95
  val_split: 0.05
  max_samples: 1000
  balance_samples: true
  check_quaternion_norm: true

# Trainer: PyTorch Lightning
trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 500
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_model_summary: true
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ""
    version: null
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${hydra:runtime.output_dir}/checkpoints
      monitor: val_loss
      mode: min
      save_top_k: 3
      save_last: true
      filename: epoch{epoch:02d}-val_loss{val_loss:.4f}
      auto_insert_metric_name: false

# Hydra output directory
hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
